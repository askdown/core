# Publishes the package when a version tag (e.g. v0.3.0) is pushed.
#
#   check  type-checks, tests and builds dist/ once
#   npm    stages dist/ on npm: it goes live after a maintainer approves it
#          with `npm stage approve <stage-id>` (or on npmjs.com), with 2FA
#   vlt    publishes the same dist/ to the vlt registry (no staging there)
#
# Both registries use trusted publishing (OIDC), so no tokens are stored in
# the repo. Each needs a trusted publisher for this repository and the
# workflow file `publish.yml`:
#
#   npm trust github @askdown/core --repo askdown/core --file publish.yml --allow-stage-publish
#   npm trust github @askdown/core --repo askdown/core --file publish.yml --allow-publish \
#     --registry=https://registry.vlt.io/askdown/main/
#
# A new npm trusted publisher expires if it isn't used within 2 days, so add
# it just before tagging a release. If one publish job fails, use "Re-run
# failed jobs": the other registry is left alone.
name: Publish

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Install vlt
        run: npm install --global vlt@1.7.0

      - name: Check tag matches package.json version
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi

      - run: vlt ci
      - run: vlt run typecheck
      - run: vlt run test
      - run: vlt run build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  npm:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Staged publishing needs npm 11.15.0 or later.
      - name: Update npm
        run: npm install --global npm@^11.15.0 && npm --version

      - name: Stage on npm
        working-directory: dist
        run: npm stage publish --access public --provenance

  vlt:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC token for trusted publishing
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - uses: vltpkg/setup-vlt@v1

      - name: Publish to the vlt registry
        working-directory: dist
        run: vlt publish --access public --registry=https://registry.vlt.io/askdown/main/
